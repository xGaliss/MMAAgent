app = "mmaagent-api"
primary_region = "mad"

[build]
  dockerfile = "MMAAgent.Web/Dockerfile"

[env]
  ASPNETCORE_ENVIRONMENT = "Production"
  ASPNETCORE_URLS = "http://+:8080"
  Database__Path = "/data/saves/bootstrap.db"
  Database__SaveRootDirectory = "/data/saves"
  AuthBridge__AllowDevelopmentHeaders = "false"
  ApiSecurity__RequireExternalAuthForSaveOperations = "true"
  ApiSecurity__AllowDevelopmentBypassForSaveOperations = "false"
  SaveCatalog__Provider = "supabase-postgres"
  SaveCatalog__MirrorLocalJson = "false"
  SaveCatalog__Schema = "mma_agent"
  SaveCatalog__BackendInstanceName = "fly"
  SupabaseAuth__Enabled = "true"

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "off"
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/api/v1/health"
    timeout = "5s"

[[mounts]]
  source = "mmaagent_data"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
